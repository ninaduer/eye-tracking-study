<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">

  <title>CM System - Home</title>
  <style>
    :root { background-color: #000; } /* Immediate fix */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 60px;
      background: #050505;

    }

    h1 {
      font-size: 18px;
      margin-bottom: 40px;
      color: #ffffff;
    }

    .nav-box {
      display: flex;
      gap: 20px;
    }

    .btn {
      width: 220px;
      padding: 20px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.3s;
      border: 1px solid;
      display: block;
      border-color: #39FF14;
      color: #39FF14;
      background: transparent;
    }

    .btn:hover {
      background: #39FF14;
      color: #000;
    }

    

    .description {
      margin-top: 15px;
      font-size: 12px;
      color: #ffffff;
      letter-spacing: 1px;
    }
  </style>
</head>
<body style="background-color: #000000;">

  <div class="container">
    <h1>CURIOSITY METHOD</h1>
    
  <div class="nav-box">
    <div>
        <a href="study.html" class="btn study-btn" target="_blank" rel="noopener noreferrer">Start Study</a>
        <div class="description">DATA COLLECTION</div>
    </div>

    <div>
        <a href="visualizer.html" class="btn viz-btn" target="_blank" rel="noopener noreferrer">Visualizer</a>
        <div class="description">DATA ANALYSIS</div>
    </div>
</div>

</body>
</html>
